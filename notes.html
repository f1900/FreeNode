<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>免费节点</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="notes.css">
</head>

<body data-page="notes">
  <div class="app-container">
    <!-- 菜单由 menu.js 动态注入 -->

    <div class="page-content">
      <div class="page active">
        <h2><i class="fas fa-paper-plane"></i> 免费节点</h2>
        <p>节点每天更新。点击右上角按钮可一键复制全部内容。</p>

        <div class="editor-wrap">
          <button class="copy-btn" id="copyBtn" type="button" aria-label="复制全部内容">
            <i class="fas fa-copy" id="copyIcon"></i>
            <span id="copyText">一键复制</span>
          </button>
          <textarea id="editor" class="editor" readonly placeholder="系统正在加载或验证内容…" spellcheck="false"></textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- 防机器人验证码弹窗 (隐藏状态) -->
  <div class="captcha-overlay" id="captchaOverlay">
    <div class="captcha-box">
      <h3><i class="fas fa-shield-halved"></i> 人机验证</h3>
      <p>输入答案，获取免费节点</p>
      <div class="captcha-question" id="captchaQuestion">1 + 1 = ?</div>
      <input type="number" id="captchaInput" class="captcha-input" placeholder="请输入答案" autocomplete="off">
      <div class="captcha-actions">
        <button class="captcha-btn cancel" id="captchaCancel">取消</button>
        <button class="captcha-btn confirm" id="captchaConfirm">确认验证</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="menu.js"></script>
  <script>
    // 存入数据（设置24小时过期）
    function setWithExpiry(key, value, ttlMs) {
      const now = new Date();
      const item = {
        value: value,
        expiry: now.getTime() + ttlMs, // 过期时间戳
      };
      localStorage.setItem(key, JSON.stringify(item));
    }

    // 读取数据（自动检查是否过期）
    function getWithExpiry(key) {
      const itemStr = localStorage.getItem(key);
      if (!itemStr) return null;

      const item = JSON.parse(itemStr);
      const now = new Date();

      // 如果当前时间超过了过期时间，删除数据并返回 null
      if (now.getTime() > item.expiry) {
        localStorage.removeItem(key);
        return null;
      }
      return item.value;
    }
    // 使用示例：设置24小时过期 (24 * 60 * 60 * 1000 = 86400000 毫秒)
    // setWithExpiry('myData', { some: 'data' }, 86400000);

    // 读取时，会自动判断是否过期
    // const data = getWithExpiry('myData');
    // if (data) {
    //   console.log('数据有效:', data);
    // } else {
    //   console.log('数据已过期或不存在');
    // }

    // 便签逻辑（只读 + 验证码）
    $(function () {
      const $editor = $('#editor');
      const $copyBtn = $('#copyBtn');
      const $copyIcon = $('#copyIcon');
      const $copyText = $('#copyText');

      // 验证码相关 DOM
      const $captchaOverlay = $('#captchaOverlay');
      const $captchaQuestion = $('#captchaQuestion');
      const $captchaInput = $('#captchaInput');
      const $captchaConfirm = $('#captchaConfirm');
      const $captchaCancel = $('#captchaCancel');

      let captchaAnswer = 0;

      // 默认填充的演示文本
      const DEFAULT_TEXT = "欢迎使用在线便签！\n\n这里是系统为您填充的默认演示文本。\n因为当前浏览器（或您的本地存储）里没有内容，所以需要经过一次简单的安全验证。\n\n您可以点击右上角的【复制】按钮，将这段文字复制到剪贴板。\n由于这是一个只读的编辑器，您无法在此手动修改内容。";

      // 初始化加载
      function initNotes() {
        // const savedContent = localStorage.getItem('notes_content');
        const savedContent = getWithExpiry('myData');

        if (savedContent) {
          // 有内容，直接填充，不弹验证码
          $editor.val(savedContent);
        } else {
          // 没内容，显示验证码
          showCaptcha();
        }
      }

      // 生成随机验证码
      function generateCaptcha() {
        const a = Math.floor(Math.random() * 10) + 1;
        const b = Math.floor(Math.random() * 10) + 1;
        captchaAnswer = a + b;
        $captchaQuestion.text(`${a} + ${b} = ?`);
        $captchaInput.val('');
        $captchaInput.focus();
      }

      // 显示弹窗
      function showCaptcha() {
        generateCaptcha();
        $captchaOverlay.addClass('show');
      }

      // 隐藏弹窗
      function hideCaptcha() {
        $captchaOverlay.removeClass('show');
        $captchaInput.blur();
      }

      // 确认验证
      $captchaConfirm.on('click', async function () {
        const userAnswer = parseInt($captchaInput.val(), 10);
        if (userAnswer === captchaAnswer) {
          // 验证成功
          // $editor.val(DEFAULT_TEXT);
          // localStorage.setItem('notes_content', DEFAULT_TEXT); // 存入本地，下次直接加载
          // const resxml = await fetch('https://4977.eu.org/proxy');
          // const html =await resxml.text();
          // $editor.val(html);

          // hideCaptcha();

          // 禁用按钮，防止重复点击
          $captchaConfirm.prop('disabled', true).text('加载中...');

          // 显示 loading 动画（可用文字或 spinner）
          const $loading = $(`
          <div class="loading-mask">
            <i class="fas fa-spinner" aria-hidden="true"></i>
            <span>正在加载数据...</span>
          </div>`);
          $('body').append($loading);

          try {
            const resxml = await fetch('https://4977.eu.org/freenode',{method:'post'});
            if (!resxml.ok) throw new Error('请求失败: ' + resxml.status);
            const html = await resxml.text();
            $editor.val(html);

            hideCaptcha();
            setWithExpiry('myData', html, 86400000);// 存入本地，下次直接加载
          } catch (err) {
            console.error(err);
            alert('数据加载失败，请重试');
            // 也可以恢复验证码
            generateCaptcha();
          } finally {
            $loading.remove();
            $captchaConfirm.prop('disabled', false).text('确认');
          }

        } else {
          // 验证失败，刷新题目
          $captchaQuestion.css('color', '#ef4444');
          setTimeout(() => $captchaQuestion.css('color', ''), 500);
          generateCaptcha();
        }
      });

      // 输入框回车直接确认
      $captchaInput.on('keypress', function (e) {
        if (e.which === 13) {
          $captchaConfirm.click();
        }
      });

      // 取消验证（保持空白）
      $captchaCancel.on('click', function () {
        hideCaptcha();
        $editor.attr('placeholder', '请输入验证码');
      });

      // 按钮反馈
      function flash(iconClass, text, color) {
        $copyIcon.attr('class', 'fas ' + iconClass).css('color', color);
        $copyText.text(text);
        $copyBtn.addClass('flash');
        setTimeout(function () {
          $copyIcon.attr('class', 'fas fa-copy').css('color', '');
          $copyText.text('复制');
          $copyBtn.removeClass('flash');
        }, 1600);
      }

      // 复制逻辑
      function copyContent() {
        const text = $editor.val();
        if (!text) {
          flash('fa-circle-exclamation', '无内容', '#f59e0b');
          return;
        }

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text)
            .then(function () { flash('fa-check', '已复制', '#22c55e'); })
            .catch(function () { flash('fa-xmark', '复制失败', '#ef4444'); });
        } else {
          const el = $editor.get(0);
          el.select();
          el.setSelectionRange(0, text.length);
          try {
            document.execCommand('copy');
            flash('fa-check', '已复制', '#22c55e');
          } catch (err) {
            flash('fa-xmark', '复制失败', '#ef4444');
          }
          window.getSelection().removeAllRanges();
          el.blur();
        }
      }

      // 点击复制
      $copyBtn.on('click', copyContent);

      // 快捷键 Ctrl/Cmd + Shift + C
      $(document).on('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'c') {
          e.preventDefault();
          copyContent();
        }
      });

      // 启动
      initNotes();
    });
  </script>
</body>

</html>

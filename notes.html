<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>在线便签</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="notes">
  <div class="app-container">
    <!-- 菜单由 menu.js 动态注入 -->

    <div class="page-content">
      <div class="page active">
        <h2><i class="fas fa-pen-to-square"></i> 在线便签</h2>
        <p>在此输入文字，点击右上角按钮可一键复制全部内容。</p>

        <div class="editor-wrap">
          <button class="copy-btn" id="copyBtn" type="button" aria-label="复制全部内容">
            <i class="fas fa-copy" id="copyIcon"></i>
            <span id="copyText">复制</span>
          </button>
          <textarea
            id="editor"
            class="editor"
            placeholder="在此输入或粘贴您的文本…"
            spellcheck="false"
          ></textarea>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="menu.js"></script>
  <script>
    // 便签逻辑（jQuery 版）
    $(function () {
      const $editor   = $('#editor');
      const $copyBtn  = $('#copyBtn');
      const $copyIcon = $('#copyIcon');
      const $copyText = $('#copyText');

      // 恢复上次内容
      const saved = localStorage.getItem('notes_content');
      if (saved) $editor.val(saved);

      // 自动保存
      $editor.on('input', function () {
        localStorage.setItem('notes_content', $editor.val());
      });

      // 按钮反馈
      function flash(iconClass, text, color) {
        $copyIcon.attr('class', 'fas ' + iconClass).css('color', color);
        $copyText.text(text);
        $copyBtn.addClass('flash');
        setTimeout(function () {
          $copyIcon.attr('class', 'fas fa-copy').css('color', '');
          $copyText.text('复制');
          $copyBtn.removeClass('flash');
        }, 1600);
      }

      // 复制逻辑：优先 Clipboard API，降级 execCommand
      function copyContent() {
        const text = $editor.val();
        if (!text) {
          flash('fa-circle-exclamation', '空内容', '#f59e0b');
          return;
        }

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text)
            .then(function () { flash('fa-check', '已复制', '#22c55e'); })
            .catch(function () { flash('fa-xmark', '复制失败', '#ef4444'); });
        } else {
          // 降级方案
          const el = $editor.get(0);
          el.select();
          el.setSelectionRange(0, text.length);
          try {
            document.execCommand('copy');
            flash('fa-check', '已复制', '#22c55e');
          } catch (err) {
            flash('fa-xmark', '复制失败', '#ef4444');
          }
          window.getSelection().removeAllRanges();
          el.blur();
        }
      }

      // 点击复制
      $copyBtn.on('click', copyContent);

      // 快捷键 Ctrl/Cmd + Shift + C
      $(document).on('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'c') {
          e.preventDefault();
          copyContent();
        }
      });
    });
  </script>
</body>
</html>

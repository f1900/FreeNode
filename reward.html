<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>支持与打赏</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="reward.css">
</head>
<body data-page="reward">
  <div class="app-container">
    <!-- 菜单由 menu.js 动态注入 -->

    <div class="page-content">
      <div class="page active">
        <h2><i class="fas fa-mug-hot"></i> 支持与打赏</h2>
        <p>如果您觉得这个小站对您有帮助，欢迎请作者喝杯咖啡。您的支持是我持续维护的动力！</p>

        <div class="reward-grid">
          <!-- 微信打赏 -->
          <div class="reward-card">
            <div class="reward-header wechat">
              <i class="fab fa-weixin"></i> 微信支付
            </div>
            <div class="reward-qr">
              <!-- 请将下面的 src 替换为您自己的微信收款码图片地址 -->
              <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=WeChat_Pay_Placeholder" alt="微信收款码">
            </div>
            <p class="reward-tip">扫一扫，请作者喝杯咖啡</p>
          </div>

          <!-- 支付宝打赏 -->
          <div class="reward-card">
            <div class="reward-header alipay">
              <i class="fab fa-alipay"></i> 支付宝
            </div>
            <div class="reward-qr">
              <!-- 请将下面的 src 替换为您自己的支付宝收款码图片地址 -->
              <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=Alipay_Placeholder" alt="支付宝收款码">
            </div>
            <p class="reward-tip">扫一扫，请作者喝杯咖啡</p>
          </div>
        </div>

        <p class="reward-footer">
          <i class="fas fa-heart" style="color: #ef4444;"></i>
          感谢您的每一份心意！
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="menu.js"></script>
</body>
</html>

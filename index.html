<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>三页切换 · 自适应昼夜双模式</title>
  <!-- Font Awesome 图标库（外部依赖） -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 昼夜切换按钮 -->
  <div class="theme-toggle" id="themeToggle" title="切换昼夜模式" role="button" aria-label="切换昼夜模式" tabindex="0">
    <i class="fas fa-moon" id="themeIcon"></i>
  </div>

  <div class="app-container">
    <!-- 三个菜单项 -->
    <div class="menu" id="menu">
      <div class="menu-item active" data-page="page1" id="menu1" role="button" tabindex="0" aria-label="探索页面">
        <i class="fas fa-compass"></i>
        <span>探索</span>
      </div>
      <div class="menu-item" data-page="page2" id="menu2" role="button" tabindex="0" aria-label="洞察页面">
        <i class="fas fa-chart-line"></i>
        <span>洞察</span>
      </div>
      <div class="menu-item" data-page="page3" id="menu3" role="button" tabindex="0" aria-label="精选页面">
        <i class="fas fa-gem"></i>
        <span>精选</span>
      </div>
    </div>

    <!-- 三个页面内容 -->
    <div class="page-content">
      <!-- 页面 1 -->
      <div class="page active" id="page1">
        <h2><i class="fas fa-compass"></i> 探索无界</h2>
        <p>发现未知的风景与灵感。每一次点击都是一次全新的旅程，我们为你准备了最纯粹的内容体验。</p>
        <div class="page-feature">
          <div class="feature-chip"><i class="fas fa-mountain"></i> 自然灵感</div>
          <div class="feature-chip"><i class="fas fa-sun"></i> 每日更新</div>
          <div class="feature-chip"><i class="fas fa-leaf"></i> 极简生活</div>
        </div>
      </div>

      <!-- 页面 2 -->
      <div class="page" id="page2">
        <h2><i class="fas fa-chart-line"></i> 数据洞察</h2>
        <p>透过数字看见趋势，理解背后的故事。我们收集了最有价值的信号，帮助你做出更聪明的决策。</p>
        <div class="page-feature">
          <div class="feature-chip"><i class="fas fa-chart-pie"></i> 实时分析</div>
          <div class="feature-chip"><i class="fas fa-brain"></i> 智能预测</div>
          <div class="feature-chip"><i class="fas fa-clock"></i> 历史对比</div>
        </div>
      </div>

      <!-- 页面 3 -->
      <div class="page" id="page3">
        <h2><i class="fas fa-gem"></i> 精选典藏</h2>
        <p>精心挑选的优质内容，只为追求品质的你。每一份推荐都经过层层筛选，值得细细品味。</p>
        <div class="page-feature">
          <div class="feature-chip"><i class="fas fa-star"></i> 编辑推荐</div>
          <div class="feature-chip"><i class="fas fa-medal"></i> 口碑之选</div>
          <div class="feature-chip"><i class="fas fa-crown"></i> 限量内容</div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
